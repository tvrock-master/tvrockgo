host: "localhost:80"
maxconnection: 100
writetimeout: 50000          # msec
readtimeout: 50000           # msec
readHeadertimeout: 10000     # msec
idletimeout: 120000          # msec
allowOrigins:
  - "http://localhost"
  - "http://127.0.0.1"
allowOriginPrefix:
  - "http://192.168."
# データベース
dbfile: "./data/data.db"
programdbfile: "./data/programs.db"
captiondbfile: "./data/caption.db"
pastdbfile: "./data/past.db"
archivedbfile: "./data/archive.db"
captionarchivedbfile: "./data/captionarc.db"
blevefile: "./data/bleve-program"
# 録画 (Webアプリで設定できます)
recordersetting:
  gaijiexclusion: 0               # 録画ファイル名の外字削除
  filenameex: "@TT"               # 録画ファイル名置換
  recordfileextension: ".ts"      # 録画ファイル拡張子
  analyzetsafterrecording: false  # 録画後にTS解析処理を行う
# タスク
tasksetting:
  maxtasks: 32              # タスク最大
  exectime: 600             # 溢れたタスクの再スケジュール時刻
# 電源管理
powermanagersetting:
  powermanager: false                         # 電源管理ON/OFF
  preventsleep: true                          # スリープ抑止ON/OFF
  sleeptimer: 5                               # 予約が無い状態でスリープへの移行時間(分)
  sleeptimerpause: false                      # スリープタイマー・一時停止
  preventifdevicerunning: true                # デバイスが起動していればスリープへ移行しない
  wakebeforeschedule: 5                       # 次の予約の開始時刻から指定時間前に解除(分)(0でOFF)
  waketaskname: tvrockgo-WakeForNextSchedule  # タスクスケジューラで使用するタスク名(windows)
  wakeupsuppressduration: 100                 # スリープ解除後のスリープ抑制時間(秒)(windows)
  preventsleeptime: 600                       # 次の録画予約までのスリープ抑制時間(秒)(windows)
  preventdisplayoff: true                     # モニタOFFを抑止
archiversetting:
  executioninterval: 86400                    # アーカイバが起動する時間間隔(秒)
  suspendtime: 1800                           # 録画予約がある場合のアーカイバの抑止時間(秒)
  archiverbleveinsertmax: 1000                # 一度に古いデータをBleveへ登録する際の上限
# リモート視聴
remotewatch:
  maxsessions: 32                             # 録画デバイスごとの同時視聴セッション数の上限（0以下は32）
  keepbeforescheduleseconds: 60               # 視聴終了時に録画アプリを残す次のスケジュール起動までの時間
  disconnectgraceseconds: 15                  # 通信切断時に視聴セッションを保持する猶予時間
  startuptimeoutseconds: 60                   # 視聴開始時に準備完了を待つ時間
bootwebserver: true         # WEBサーバー起動
bootlauncher: true          # ランチャ起動
bootscheduler: true         # スケジューラー起動
bootarchiver: true          # アーカイバ起動
bleve: false                # 全文検索エンジン
captionrecord: true         # 字幕保存
adjustbctime: true
isafterwithmargin: false    # アイドル時間をスケジュールの衝突判定に含める
adjusttimethreshold: 600
launcherhostid: ""
launchertoken: ""           # 内蔵ランチャー専用。未設定時に自動生成・保存（公開・共有しない）
devicerequestqueuesize: 256
devicebootuptimeout: 30
deviceshutdowntime: 3       # デバイスの終了するための猶予(秒)
searchmaxworkerthreads: 4   # 検索時の番組テキスト照合・字幕フェッチ並行処理に使用する最大ワーカースレッド
debug: false
frontendstationlimit: 1024  # フロントエンド局情報取得最大
sqlitesetting:              # Sqlite設定
  - "cache=private"
  - "_pragma=busy_timeout(5000)"
  - "_pragma=journal_mode(WAL)"
  - "_pragma=synchronous(NORMAL)"
  - "_pragma=cache_size(-65536)"
  - "_pragma=mmap_size(268435456)"
  - "_pragma=temp_store(MEMORY)"
# cron設定
crontask:
  storagesurvey: "*/1 * * * *"          # ストレージ監視間隔
  archiver: "*/20 * * * *"              # アーカイバ作動間隔(以前の処理からarchiversetting.executioninterval時間経たないと実行されない)
  indexingarchive: "*/1 * * * *"        # 全文検索インデクシング間隔
  fetchprogramscheduler: "10 */2 * * *" # 番組情報取得スケジュール予約処理
searchlimit: 3000                       # 検索数最大
currentprogramthreshold: 604800         # 現行で使用するのスケジュール及び番組(秒)
currentkeywordreservethreshold: 2592000 # 現行で使用する検索予約(秒)
currentcaptionthreshold: 604800         # 現行で使用する字幕(秒)
# ユーザー認証
authentication: true
# ログインアカウント（複数指定可能）
useraccount:
  myaccount: "mypassword"
cookiedomain: "localhost"
cookiename: "tvrockgo"
cookiepath: "/"
sessionname: "tvrockgo"
sessionsecretkey: ""
sessionmaxage: 31536000
sessionmaxlength: 100000000
sessionhttponly: true
# デバイス設定
devicemacrots: &devmacrots                          # 地上波マクロ
  apppath1: "C:\\Recorder\\TVTest.exe"              # 視聴アプリ・フルパス
  apppath2: "C:\\Recorder\\RecTest.exe"             # 録画アプリ・フルパス
  apppath3: "C:\\Recorder\\TVH264.exe"              # 視聴アプリ・フルパス(ワンセグ)
  apppath4: "C:\\Recorder\\RecTest.exe"             # 録画アプリ・フルパス(ワンセグ)
  recordpath: "D:\\RecordTS"                        # 録画ファイルのフォルダ
  tunertype: 0                                      # 0=地上波,1=BS/CS
devicemacrobscs: &devmacrobscs                      # BSCSマクロ
  apppath1: "C:\\Recorder\\TVTest.exe"              # 視聴アプリ・フルパス
  apppath2: "C:\\Recorder\\RecTest.exe"             # 録画アプリ・フルパス
  recordpath: "D:\\RecordBSCS"                      # 録画ファイルのフォルダ
  tunertype: 1                                      # 0=地上波,1=BS/CS

