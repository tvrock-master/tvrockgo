# 自動録画予約デバイス優先順位
recordingdevice:
  orderts:     # 地上波
    - "REC01"
    - "REC02"
    - "REC03"
    - "REC04"
  orderbs:     # BS
    - "REC05"
    - "REC06"
    - "REC07"
    - "REC08"
  ordercs:     # CS
    - "REC05"
    - "REC06"
    - "REC07"
    - "REC08"
  orderos:     # ワンセグ
    - "REC01"
    - "REC02"
    - "REC03"
    - "REC04"
  # 補助デバイス
  assist: false
# デバイスに対応する補助デバイスID
#  deviceassistance:
#    REC01: SUB01
#    REC02: SUB02
#    REC03: SUB03
#    REC04: SUB04
#    REC05: SUB05
#    REC06: SUB06
#    REC07: SUB07
#    REC08: SUB08
# 番組情報取得スケジュール
fetchprogram:
  schedulets: true
  schedulebs: true
  schedulecs: true
  scheduleos: true
  # 番組情報取得のタイムアウト(秒)
  timeoutts: 30
  timeoutbs: 90
  timeoutcs: 120
  timeoutos: 30
  # スケジュール時間
  scheduleduration: 1800
  # スケジュール登録操作時間(12時間毎)
  schedulewindow: 43200
  schedulehours:
    - 7
    - 8
  # タスクが次回実行するまでの時間
  schedulerperiod: 43200
  # スケジュール登録操作時間(1分)
  searchstep: 30
  # 取得デバイス優先順位
  deviceorderts:
    - "REC04"
    - "REC03"
    - "REC02"
    - "REC01"
  deviceorderbs:
    - "REC08"
    - "REC07"
    - "REC06"
    - "REC05"
  deviceordercs:
    - "REC08"
    - "REC07"
    - "REC06"
    - "REC05"
  deviceorderos:
    - "REC04"
    - "REC03"
    - "REC02"
    - "REC01"
# ストレージ調査コマンド
#storagecommand:
#  id: StorageSurvey
#  apppath: cmd.exe
#  options:
#  - /c
#  - wmic logicaldisk get caption,freespace,size,volumename
storagecommand:
  id: StorageSurvey
  apppath: powershell
  options:
  - "-Command"
  - "Get-CimInstance Win32_LogicalDisk | Select-Object Caption,FreeSpace,Size,VolumeName"
# カスタムコマンド
# optionsは固定引数のみ。番組情報は環境変数TVROCK_CONTEXT_FILEが指すJSONで取得。
# docs/custom-commands.md と docs/custom-command-examples/ を参照。
customcommand:
# サンプル1
- id: Directory
  mode: 0             # 0:録画停止後に実行 1:録画開始時に実行 2:待機開始時に実行
  dependencies: ""    # 他のコマンドIDで実行
  type: powershell
  apppath: "./docs/custom-command-examples/Directory.ps1"
  options: []
# サンプル2
- id: Touch
  mode: 0
  dependencies: ""
  type: batch
  apppath: "./docs/custom-command-examples/Touch.cmd"
  options: []
# サンプル3
- id: Tweet
  mode: 1
  dependencies: "Touch"
  type: powershell
  apppath: "./docs/custom-command-examples/WriteRecordInfo.ps1"
  options:
  - "-Mode"
  - "Tweet"
# 番組特集判定パターン
features:
  - name: new
    pattern: '.*(🈟|\[新\])|（新）|\(新\)|＜新＞.*'
  - name: end
    pattern: '.*(🈡|\[終\])|（終）|\(終\)|＜終＞.*'
  - name: first
    pattern: '.*第(1|一)回|第(1|一)話|第(1|一)幕|#0*1($|^[0-9])|（初）|🈠|No\.0*1($|^[0-9])'
  - name: free
    pattern: '.*(🈚|\[無\]\[無料\]).*'
#  - name: feature1
#    pattern: '.*(🈟|\[生\])|（生）|\(生\)|＜生＞.*'
#  - name: feature2
#    pattern: '.*(🈟|\[生\])|（生）|\(生\)|＜生＞.*'
#  - name: feature3
#    pattern: '.*(🈟|\[生\])|（生）|\(生\)|＜生＞.*'
#  - name: feature4
#    pattern: '.*(🈟|\[生\])|（生）|\(生\)|＜生＞.*'
#
# 再生デバイス。視聴アプリとSRT受信ポートは各Rockbarで設定します。
# 未指定の場合もPBK01～PBK08が使用できます。Rockbarのデバイス一覧には使用時だけ表示します。
playbackdevices:
  - id: PBK01
  - id: PBK02
  - id: PBK03
  - id: PBK04
  - id: PBK05
  - id: PBK06
  - id: PBK07
  - id: PBK08
#
# サービスの親子対応（tsp: 1=地上波、2=BS、3=CS、4=ワンセグ、16=4K）
# SIDは放送波の16ビット値。同じTSに親・子がある場合だけ適用し、地上波の自動判定より優先。
# 未指定の地上波は同じTSIDの最小SIDのフルセグTVを親に自動判定、BS/CS/4Kは独立扱い。空配列 [] で明示指定なし。
servicegroups:
  - tsp: 2
    parent: 101
    children: [102, 103]
  - tsp: 2
    parent: 141
    children: [142, 143]
  - tsp: 2
    parent: 151
    children: [152, 153]
  - tsp: 2
    parent: 161
    children: [162, 163]
  - tsp: 2
    parent: 171
    children: [172, 173]
  - tsp: 2
    parent: 181
    children: [182, 183]
# 境界線判断テーブル
tscmboundaryrules:
  - sid: 1040
    pid: 0x051f
    nopacketseconds: 10
    startforwardpackets: 0
    endbackpackets: 0
  - sid: 1056
    pid: 0x081a
    nopacketseconds: 5
    startforwardpackets: 0
    endbackpackets: 0
  - sid: 1064
    pid: 0x1005
    nopacketseconds: 5
    startforwardpackets: 3
    endbackpackets: 0
  - sid: 23608
    pid: 0x075e
    nopacketseconds: 5
    startforwardpackets: 3
    endbackpackets: 8
